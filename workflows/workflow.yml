name: "Feature Development Pipeline"
# provider: LLMプロバイダー ("gemini-cli", "copilot-cli")
# model:    使用モデル (省略時はプロバイダのデフォルト)
# 利用可能モデル:
#   gemini-cli:  gemini-2.5-flash
#   copilot-cli: gpt-5-mini, gpt-5, claude-sonnet-4, claude-sonnet-4.5
# テンプレート変数:
#   {{branch_name}} — git_branch ステップで作成されたブランチ名に展開
steps:
  # --- 単純タスク: 軽量モデルで十分 ---
  - id: "generate_branch_name"
    type: "llm_task"
    agent_role: "ReleaseEngineer"
    provider: "copilot-cli"
    model: "gpt-5-mini"
    system_prompt_file: "./prompts/branch_namer.md"
    input_file: "./inbox/idea.txt"
    output_file: "./docs/branch_name.txt"

  - id: "branch_creation"
    type: "git_branch"
    branch_name_file: "./docs/branch_name.txt"

  # --- 高推論タスク: 高性能モデルが必要 ---
  - id: "prd_generation"
    type: "llm_task"
    agent_role: "ProductManager"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    system_prompt_file: "./prompts/pm.md"
    input_file: "./inbox/idea.txt"
    output_file: "./docs/{{branch_name}}/prd.md"

  - id: "prd_review"
    type: "review"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    review_prompt_file: "./prompts/prd_reviewer.md"
    target_file: "./docs/{{branch_name}}/prd.md"
    max_retries: 3
    fixer_prompt_file: "./prompts/document_fixer.md"

  - id: "architecture_design"
    type: "llm_task"
    agent_role: "Architect"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    system_prompt_file: "./prompts/architect.md"
    input_file: "./docs/{{branch_name}}/prd.md"
    output_file: "./docs/{{branch_name}}/architecture.md"

  - id: "architecture_review"
    type: "review"
    provider: "copilot-cli"
    model: "gpt-5-mini"
    review_prompt_file: "./prompts/architecture_reviewer.md"
    target_file: "./docs/{{branch_name}}/architecture.md"
    max_retries: 3
    fixer_prompt_file: "./prompts/document_fixer.md"

  - id: "implementation"
    type: "llm_task"
    agent_role: "Engineer"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    system_prompt_file: "./prompts/engineer.md"
    input_file: "./docs/{{branch_name}}/architecture.md"
    output_file: "./cmd/nexus-weaver/main.go"

  - id: "format_and_vet"
    type: "loop"
    max_retries: 3
    command: "go fmt ./... && go vet ./..."
    provider: "copilot-cli"
    model: "gpt-5-mini"
    fixer_prompt_file: "./prompts/fixer.md"
    target_file: "./cmd/nexus-weaver/main.go"

  - id: "test_and_fix_loop"
    type: "loop"
    max_retries: 3
    command: "go test ./..."
    provider: "copilot-cli"
    model: "gpt-5-mini"
    fixer_prompt_file: "./prompts/fixer.md"
    target_file: "./cmd/nexus-weaver/main.go"

  - id: "code_review"
    type: "review"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    review_prompt_file: "./prompts/reviewer.md"
    target_file: "./cmd/nexus-weaver/main.go"
    max_retries: 3
    fixer_prompt_file: "./prompts/fixer.md"

  - id: "qa_review"
    type: "review"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    review_prompt_file: "./prompts/qa.md"
    target_file: "./cmd/nexus-weaver/main.go"
    max_retries: 3
    fixer_prompt_file: "./prompts/fixer.md"

  - id: "security_review"
    type: "review"
    provider: "gemini-cli"
    model: "gemini-2.5-flash"
    review_prompt_file: "./prompts/security.md"
    target_file: "./cmd/nexus-weaver/main.go"
    max_retries: 3
    fixer_prompt_file: "./prompts/fixer.md"

  # --- 単純タスク: 軽量モデルで十分 ---
  - id: "pr_title_generation"
    type: "llm_task"
    agent_role: "TechLead"
    provider: "copilot-cli"
    model: "gpt-5-mini"
    system_prompt_file: "./prompts/pr_title.md"
    input_file: "./docs/{{branch_name}}/prd.md"
    output_file: "./docs/{{branch_name}}/pr_title.txt"

  - id: "pr_body_generation"
    type: "llm_task"
    agent_role: "TechLead"
    provider: "copilot-cli"
    model: "gpt-5-mini"
    system_prompt_file: "./prompts/pr_body.md"
    input_file: "./docs/{{branch_name}}/prd.md"
    output_file: "./docs/{{branch_name}}/pr_body.md"

  - id: "push_to_remote"
    type: "git_push"
    remote: "origin"

  - id: "create_pr"
    type: "command_task"
    command: "gh pr create --title \"$(cat ./docs/{{branch_name}}/pr_title.txt)\" --body-file ./docs/{{branch_name}}/pr_body.md"
